# More option see https://github.com/DreamMaoMao/mango/wiki/

exec-once = mako
exec-once= waybar
exec-once= awww-daemon
#exec-once= ~/.config/scripts/random-wallpaper.sh
exec-once= ~/.config/scripts/sequencia.sh
exec-once= ~/.config/scripts/battery_tracker.sh
exec-once= ~/.config/scripts/wlsunset.sh
exec-once= hypridle
exec-once = wl-paste --type image --watch cliphist store
exec-once = wl-paste --type text --watch cliphist store

# keyboard
repeat_rate=25
repeat_delay=300
numlockon=1
xkb_rules_layout=br

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0
accel_profile=1
accel_speed=0.2

# Appearance
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9

# Axis Bindings
axisbind=SUPER,UP,focusdir,right
axisbind=SUPER,DOWN,focusdir,left

# Monitor Rules
monitorrule=name:^eDP-1$,width:1366,height:768,refresh:60,x:0,y:0,scale:1,vrr:0,rr:0
monitorrule=name:^HDMI-A-1$,width:1920,height:1080,refresh:100,x:1366,y:0,scale:1,vrr:0,rr:0

# Scroller Layout Setting
scroller_structs=10
scroller_default_proportion=0.5
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_mfact=0.50
default_nmaster=1
smartgaps=0

# Dwindle Layout Setting
dwindle_smart_split=0.5
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_hsplit=0
dwindle_vsplit=1
dwindle_preserve_split=0

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller,vertical_grid,vertical_deck,dwindle,fair,vertical_fair
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

# Overview setting
hotarea_size=5
enable_hotarea=1
hotarea_corner=1
ov_tab_mode=0
ov_no_resize=0
overviewgappi=10
overviewgappo=20

# Window effect
blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes = 4
blur_params_radius = 6
blur_params_noise = 0.02
blur_params_brightness = 1.0
blur_params_contrast = 1.4
blur_params_saturation = 1.4

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0

border_radius=0
no_border_when_single=1
focused_opacity=0.95
unfocused_opacity=0.8

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1

animation_type_open=zoom
animation_type_close=zoom
zoom_initial_ratio=0.5
zoom_end_ratio=0.7

animation_fade_in=1
animation_fade_out=1
fadein_begin_opacity=0.0
fadeout_begin_opacity=0.6

tag_animation_direction=1
animation_duration_move=250
animation_duration_open=300
animation_duration_tag=400
animation_duration_close=350
animation_duration_focus=350

animation_curve_open=0.46,1.0,0.29,0.99
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# Appearance
gappih=3
gappiv=3
gappoh=5
gappov=5
borderpx=4

scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9

# sub config load
source=./bind.conf
source=./rule.conf
source=./theme.conf
source=./env.conf
