# More option see https://github.com/DreamMaoMao/mango/wiki/

exec-once=waybar
exec-once=~/.config/scripts/random-wallpaper.sh
exec-once=~/.config/scripts/battery_tracker.sh
exec-once=~/.config/scripts/wlsunset.sh
exec-once=swayidle -w timeout 300 'swaylock -i ~/.cache/current_wallpaper.png'
exec-once=wl-paste --type text --watch cliphist store # Stores only text data
exec-once=wl-paste --type image --watch cliphist store # Stores only image data

# keyboard
repeat_rate=25
repeat_delay=300
numlockon=1
xkb_rules_layout=br

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0
accel_profile=1
accel_speed=0.2

# Appearance
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9

# Axis Bindings
axisbind=SUPER,UP,focusdir,right
axisbind=SUPER,DOWN,focusdir,left

# Monitor Rules
monitorrule=name:^eDP-1$,width:1366,height:768,refresh:60,x:0,y:0,scale:1,vrr:0,rr:0
monitorrule=name:^HDMI-A-1$,width:1920,height:1080,refresh:100,x:1366,y:0,scale:1,vrr:0,rr:0

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
scroller_default_proportion_single=150
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_mfact=0.50
default_nmaster=1
smartgaps=0

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_hsplit=1
dwindle_vsplit=1
dwindle_preserve_split=0

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller,vertical_grid,vertical_deck,dwindle,fair,vertical_fair
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

# Overview setting
hotarea_size=5
enable_hotarea=1
hotarea_corner=1
ov_tab_mode=0
ov_no_resize=0
overviewgappi=10
overviewgappo=20

# sub config load
source=./bind.conf
source=./rule.conf
source=./theme.conf
