# More option see https://github.com/DreamMaoMao/mango/wiki/

exec-once=waybar
exec-once=~/.config/scripts/random-wallpaper.sh
exec-once=~/.config/scripts/battery_tracker.sh
exec-once=~/.config/scripts/wlsunset.sh
exec-once=swayidle -w timeout 300 'swaylock -i ~/.cache/current_wallpaper.png'
exec-once=wl-paste --type text --watch cliphist store # Stores only text data
exec-once=wl-paste --type image --watch cliphist store # Stores only image data

# keyboard
repeat_rate=25
repeat_delay=300
numlockon=1
xkb_rules_layout=br

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0
accel_profile=1
accel_speed=0.2

# Appearance
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9

# Axis Bindings
axisbind=SUPER,UP,focusdir,right
axisbind=SUPER,DOWN,focusdir,left

# sub config load
source=./monitor.conf
source=./bind.conf
source=./rule.conf
source=./theme.conf
source=./layout.conf
source=./overview.conf
