# Key Bindings
# key name refer to `xev` or `wev` command output,
mod keys name: SUPER,CTRL,ALT,SHIFT,NONE

# reload config
bind = SUPER,r,reload_config

bind=SUPER,Return,spawn,kitty
bind=SUPER,e,spawn,thunar
bind=SUPER,f,spawn,firefox
bind=SUPER,space,spawn,fuzzel
bind=SUPER,s,spawn,kitty --app-id music-tui -e music-tui
bind=SUPER,t,spawn,Telegram
bind=SUPER,w,spawn,kitty --app-id btop -e btop
bind=SUPER,n,spawn,kitty --app-id nmtui -e nmtui
bind=SUPER,d,spawn,kitty --app-id bluetui -e bluetui
bind=SUPER,p,spawn,kitty --app-id elio -e elio
bind=SUPER,o,spawn,kitty --app-id rig -e rig
bind=SUPER,x,spawn,bash -c 'fuzzel --dmenu < ~/.config/mango/emoji-list.txt | awk "{print \$1}" | tr -d "\n" | wl-copy'
bind=SUPER,l,spawn,hyprlock

# scripts
bind=SUPER,a,spawn,~/.config/scripts/keys.sh
bind=SUPER,c,spawn,~/.config/scripts/hyprpicker.sh -hex
bind=SUPER,i,spawn,~/.config/scripts/converter_imagens.sh
bind=SUPER,j,spawn,~/.config/scripts/extract_frames.sh
bind=SUPER,m,spawn,~/.config/scripts/exit-menu.sh
bind=SUPER,h,spawn,~/.config/scripts/random-wallpaper.sh
bind=SUPER,v,spawn,~/.config/scripts/dashboard_toggle.sh
bind=SUPER,y,spawn,~/.config/scripts/refreshWaybar.sh
bind=SUPER,g,spawn,~/.config/scripts/sequencia.sh
bind=SUPER,z,spawn,~/.config/scripts/calendar.sh
bind=SUPER,b,spawn,~/.config/scripts/clipboard_toggle.sh
bind=SUPER+SHIFT,R,spawn,~/.config/scripts/screen_recorder.sh


# Screenshots
bind=NONE,PRINT,spawn,~/.config/scripts/screenshot.sh all
bind=ALT,PRINT,spawn,~/.config/scripts/screenshot.sh monitor
bind=CTRL,PRINT,spawn,~/.config/scripts/screenshot.sh region
bind=SHIFT,PRINT,spawn,~/.config/scripts/take-screenshot.sh

# exit
bind=SUPER,q,killclient,

# switch window focus
bind=SHIFT+CTRL,tab,focusstack,next
bind=ALT,Left,focusdir,left
bind=ALT,Right,focusdir,right
bind=ALT,Up,focusdir,up
bind=ALT,Down,focusdir,down

# swap window
bind=CTRL+ALT,Up,exchange_client,up
bind=CTRL+ALT,Down,exchange_client,down
bind=CTRL+ALT,Left,exchange_client,left
bind=CTRL+ALT,Right,exchange_client,right

# switch window status
bind=SUPER,k,toggleglobal,
bind=ALT,Tab,toggleoverview,
bind=ALT,backslash,togglefloating,
bind=ALT,a,togglemaximizescreen,
bind=ALT,f,togglefullscreen,
bind=ALT+SHIFT,f,togglefakefullscreen,
bind=ALT,i,minimized,
bind=ALT,o,toggleoverlay,
bind=ALT+SHIFT,I,restore_minimized
bind=ALT,z,toggle_scratchpad

# scroller layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,
bind=ALT+SUPER+CTRL,Left,scroller_stack,left
bind=ALT+SUPER+CTRL,Right,scroller_stack,right
bind=ALT+SUPER+CTRL,Up,scroller_stack,up
bind=ALT+SUPER+CTRL,Down,scroller_stack,down

#dwindle layout(manual split mode)
bind=ALT+SHIFT,Return,dwindle_toggle_split_direction

# switch layout
bind=CTRL+SHIFT,space,switch_layout

# tag switch
bind=SUPER,Left,viewtoleft,0
bind=SUPER,Right,viewtoright,0
bind=CTRL,Left,viewtoleft_have_client,0
bind=CTRL,Right,viewtoright_have_client,0
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

bind=ALT,1,view,1,0
bind=ALT,2,view,2,0
bind=ALT,3,view,3,0
bind=ALT,4,view,4,0
bind=ALT,5,view,5,0
bind=ALT,6,view,6,0
bind=ALT,7,view,7,0
bind=ALT,8,view,8,0
bind=ALT,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=ALT,1,tagsilent,1
bind=SUPER,1,tag,1,0
bind=SUPER,2,tag,2,0
bind=SUPER,3,tag,3,0
bind=SUPER,4,tag,4,0
bind=SUPER,5,tag,5,0
bind=SUPER,6,tag,6,0
bind=SUPER,7,tag,7,0
bind=SUPER,8,tag,8,0
bind=SUPER,9,tag,9,0

# monitor switch
bind=ALT+SHIFT,Left,focusmon,left
bind=ALT+SHIFT,Right,focusmon,right
bind=SUPER+ALT,Left,tagmon,left
bind=SUPER+ALT,Right,tagmon,right

# gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# resizewin
bind=SHIFT,Up,resizewin,+0,-50
bind=SHIFT,Down,resizewin,+0,+50
bind=SHIFT,Left,resizewin,-50,+0
bind=SHIFT,Right,resizewin,+50,+0

# Mouse Button Bindings
# btn_left and btn_right can't bind NONE mod key
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SHIFT,btn_middle,togglemaximizescreen,0
mousebind=ALT,btn_right,moveresize,curresize

bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl s +5%
bind=SHIFT,XF86MonBrightnessUp,spawn,brightnessctl s 100%
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl s 5%-
bind=SHIFT,XF86MonBrightnessDown,spawn,brightnessctl s 1%

bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SINK@ toggle
bind=SHIFT,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SOURCE@ toggle

bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
